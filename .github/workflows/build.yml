name: Production Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ==================== 构建阶段（矩阵并行） ====================
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows

          # Linux 产物：AppImage（Arch 等滚动发行版直接可跑）+ deb（Ubuntu/Debian）
          # 用 22.04 构建，glibc 2.35，兼容大部分发行版
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # astra 的 Cargo.toml 以 ../../ 相对路径引用 astra-core / astra-memory，
    # 三个仓库需按兄弟目录摆放：./astra、./astra-core、./astra-memory
    defaults:
      run:
        working-directory: astra

    steps:
      # ================= 三仓库 checkout =================
      - name: Checkout astra
        uses: actions/checkout@v7
        with:
          path: astra

      - name: Checkout astra-core
        uses: actions/checkout@v7
        with:
          repository: astra-praxis/astra-core
          ref: main
          path: astra-core
          # GITHUB_TOKEN 只作用于本仓库，私有兄弟仓库需要 PAT（repo 读取权限）
          token: ${{ secrets.PAT }}

      - name: Checkout astra-memory
        uses: actions/checkout@v7
        with:
          repository: astra-praxis/astra-memory
          ref: main
          path: astra-memory
          # GITHUB_TOKEN 只作用于本仓库，私有兄弟仓库需要 PAT（repo 读取权限）
          token: ${{ secrets.PAT }}

      # ================= Linux 系统依赖（Tauri v2 需要 webkit2gtk-4.1） =================
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            file
        shell: bash

      # ================= 从 git tag 提取版本 =================
      - name: Extract version from tag
        id: version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
        shell: bash

      # ================= 更新 tauri.conf.json =================
      - name: Update tauri.conf.json version
        run: |
          python3 << 'EOF'
          import json
          version = "${{ steps.version.outputs.version }}"
          with open('src-tauri/tauri.conf.json', 'r', encoding='utf-8') as f:
              config = json.load(f)
          config['version'] = version
          with open('src-tauri/tauri.conf.json', 'w', encoding='utf-8') as f:
              json.dump(config, f, ensure_ascii=False, indent=2)
          print(f"Updated tauri.conf.json to version {version}")
          EOF
        shell: bash

      # ================= 更新 Cargo.toml =================
      - name: Update Cargo.toml version
        run: |
          python3 << 'EOF'
          import re
          version = "${{ steps.version.outputs.version }}"
          with open('src-tauri/Cargo.toml', 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r'version\s*=\s*"[^"]*"', f'version = "{version}"', content, count=1)
          with open('src-tauri/Cargo.toml', 'w', encoding='utf-8') as f:
              f.write(content)
          print(f"Updated Cargo.toml to version {version}")
          EOF
        shell: bash

      # ================= NODE =================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # ================= PNPM =================
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      # ================= RUST =================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: astra/src-tauri
          cache-all-crates: true
          save-if: ${{ github.event_name == 'push' }}

      # ================= INSTALL DEPENDENCIES =================
      # 根目录装 tauri CLI；前端在 src/（独立 package.json + lockfile，无 workspace）
      - name: Install root dependencies (tauri CLI)
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies (src/)
        run: pnpm --dir src install --frozen-lockfile

      # ================= BUNDLER 工具缓存（Linux AppImage） =================
      # tauri bundler 打包 AppImage 时需要 AppRun / linuxdeploy，从 GitHub releases
      # 下载且**没有重试**——偶发 503 会让整个打包失败（已出现过两次）。
      # 缓存目录固定为 dirs::cache_dir()/tauri = ~/.cache/tauri。
      - name: Cache Linux bundler tools
        if: matrix.platform == 'linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/tauri
          # 固定 key：工具内容不随项目变化，命中后整次构建不再联网下载
          key: tauri-bundler-tools-linux-x86_64-v1

      # 未命中缓存时带重试预下载（文件名与 bundler 期待的缓存文件名一致）
      - name: Pre-download Linux bundler tools
        if: matrix.platform == 'linux'
        run: |
          mkdir -p ~/.cache/tauri
          fetch() {
            dest="$1"; url="$2"
            if [ -s "$dest" ]; then echo "cache hit: $dest"; return 0; fi
            i=1
            while [ "$i" -le 6 ]; do
              if curl -fL --retry 3 --retry-delay 10 --retry-all-errors \
                   --connect-timeout 20 --max-time 300 -o "$dest" "$url"; then
                echo "downloaded: $dest"; return 0
              fi
              echo "attempt $i failed: $url"
              sleep $((i * 10))
              i=$((i + 1))
            done
            return 1
          }

          BASE=https://github.com/tauri-apps/binary-releases/releases/download
          fetch ~/.cache/tauri/AppRun-x86_64 "$BASE/apprun-old/AppRun-x86_64" \
            || echo "::warning::AppRun 预下载失败，交由 bundler 自行下载"
          fetch ~/.cache/tauri/linuxdeploy-x86_64.AppImage "$BASE/linuxdeploy/linuxdeploy-x86_64.AppImage" \
            || echo "::warning::linuxdeploy 预下载失败，交由 bundler 自行下载"
          chmod +x ~/.cache/tauri/AppRun-x86_64 ~/.cache/tauri/linuxdeploy-x86_64.AppImage 2>/dev/null || true
          ls -la ~/.cache/tauri
        shell: bash

      # ================= BUILD =================
      # Linux 上显式指定 bundle 类型，避免读到 conf 里的 nsis/app/dmg；
      # Windows 构建两遍：默认 downloadBootstrapper（在线小包）+ offlineInstaller（WebView2 内置版）
      # Linux 额外重试：bundler 的 AppImage 工具下载无重试，网络抖动时直接失败；
      # 重跑时 vite/cargo 均命中缓存，代价可接受。
      - name: Build Tauri App
        run: |
          build_once() {
            if [ "${{ matrix.platform }}" = "linux" ]; then
              pnpm tauri build --bundles appimage deb
            elif [ "${{ matrix.platform }}" = "windows" ]; then
              pnpm tauri build
              mkdir -p bundle-keep
              cp src-tauri/target/release/bundle/nsis/*.exe bundle-keep/
              pnpm tauri build --config src-tauri/tauri.conf.webview2.json
              for f in src-tauri/target/release/bundle/nsis/*.exe; do
                mv "$f" "${f/-setup/-setup-offline}"
              done
              mv bundle-keep/*.exe src-tauri/target/release/bundle/nsis/
              rmdir bundle-keep
            else
              pnpm tauri build
            fi
          }

          max=1
          if [ "${{ matrix.platform }}" = "linux" ]; then max=3; fi
          attempt=1
          while : ; do
            if build_once; then exit 0; fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::build failed after $attempt attempt(s)"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "::warning::build attempt $((attempt - 1)) failed, retrying ($attempt/$max)"
            sleep 30
          done
        shell: bash
        env:
          TAURI_SKIP_VALIDATION: true
          # vite/rollup 打包 monaco + mermaid 峰值内存高，Node 默认堆上限（~4GB）
          # 会触发 FATAL ERROR: JavaScript heap out of memory（SIGABRT / exit 134）
          NODE_OPTIONS: --max-old-space-size=6144

      # ================= 上传构建产物（供 release job 使用） =================
      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: |
            astra/src-tauri/target/release/bundle/dmg/*.dmg
            astra/src-tauri/target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: astra/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: |
            astra/src-tauri/target/release/bundle/appimage/*.AppImage
            astra/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  # ==================== 发布阶段（独立 job，顺序执行） ====================
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ================= 获取版本号 =================
      - name: Get version
        id: version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
        shell: bash

      # ================= 下载所有构建产物 =================
      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-artifacts
          path: ./release-assets/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-artifacts
          path: ./release-assets/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-artifacts
          path: ./release-assets/linux

      # ================= 列出下载的文件（调试用） =================
      - name: List downloaded files
        run: |
          echo "=== macOS files ==="
          find ./release-assets/macos -type f || echo "No macOS files"
          echo "=== Windows files ==="
          find ./release-assets/windows -type f || echo "No Windows files"
        shell: bash

      # ================= 创建 Release 并上传产物 =================
      # 产物文件名由 tauri 生成（astra_<version>_<arch>-setup.exe / .dmg）
      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          name: Astra ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/macos/**/*.dmg
            release-assets/windows/**/*.exe
            release-assets/linux/**/*.AppImage
            release-assets/linux/**/*.deb
          # glob 未匹配到文件时直接失败，避免再出现“构建成功但 Release 缺资产”的静默问题
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
