name: Production Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ==================== 构建阶段（矩阵并行） ====================
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # astra 的 Cargo.toml 以 ../../ 相对路径引用 astra-core / astra-memory，
    # 三个仓库需按兄弟目录摆放：./astra、./astra-core、./astra-memory
    defaults:
      run:
        working-directory: astra

    steps:
      # ================= 三仓库 checkout =================
      - name: Checkout astra
        uses: actions/checkout@v4
        with:
          path: astra

      - name: Checkout astra-core
        uses: actions/checkout@v4
        with:
          repository: alanpaper/astra-core
          ref: main
          path: astra-core

      - name: Checkout astra-memory
        uses: actions/checkout@v4
        with:
          repository: alanpaper/astra-memory
          ref: main
          path: astra-memory

      # ================= 从 git tag 提取版本 =================
      - name: Extract version from tag
        id: version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
        shell: bash

      # ================= 更新 tauri.conf.json =================
      - name: Update tauri.conf.json version
        run: |
          python3 << 'EOF'
          import json
          version = "${{ steps.version.outputs.version }}"
          with open('src-tauri/tauri.conf.json', 'r', encoding='utf-8') as f:
              config = json.load(f)
          config['version'] = version
          with open('src-tauri/tauri.conf.json', 'w', encoding='utf-8') as f:
              json.dump(config, f, ensure_ascii=False, indent=2)
          print(f"Updated tauri.conf.json to version {version}")
          EOF
        shell: bash

      # ================= 更新 Cargo.toml =================
      - name: Update Cargo.toml version
        run: |
          python3 << 'EOF'
          import re
          version = "${{ steps.version.outputs.version }}"
          with open('src-tauri/Cargo.toml', 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r'version\s*=\s*"[^"]*"', f'version = "{version}"', content, count=1)
          with open('src-tauri/Cargo.toml', 'w', encoding='utf-8') as f:
              f.write(content)
          print(f"Updated Cargo.toml to version {version}")
          EOF
        shell: bash

      # ================= NODE =================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ================= PNPM =================
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      # ================= RUST =================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: astra/src-tauri
          cache-all-crates: true
          save-if: ${{ github.event_name == 'push' }}

      # ================= INSTALL DEPENDENCIES =================
      # 根目录装 tauri CLI；前端在 src/（独立 package.json + lockfile，无 workspace）
      - name: Install root dependencies (tauri CLI)
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies (src/)
        run: pnpm --dir src install --frozen-lockfile

      # ================= BUILD =================
      - name: Build Tauri App
        run: pnpm tauri build
        env:
          TAURI_SKIP_VALIDATION: true

      # ================= 上传构建产物（供 release job 使用） =================
      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            astra/src-tauri/target/release/bundle/dmg/*.dmg
            astra/src-tauri/target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: astra/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  # ==================== 发布阶段（独立 job，顺序执行） ====================
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ================= 获取版本号 =================
      - name: Get version
        id: version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
        shell: bash

      # ================= 下载所有构建产物 =================
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: ./release-assets/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: ./release-assets/windows

      # ================= 列出下载的文件（调试用） =================
      - name: List downloaded files
        run: |
          echo "=== macOS files ==="
          ls -la ./release-assets/macos || echo "No macOS files"
          echo "=== Windows files ==="
          ls -la ./release-assets/windows || echo "No Windows files"
        shell: bash

      # ================= 创建 Release 并上传产物 =================
      # 产物文件名由 tauri 生成（astra_<version>_<arch>-setup.exe / .dmg）
      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Astra ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/macos/*.dmg
            release-assets/windows/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
