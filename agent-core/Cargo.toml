[package]
name = "agent-core"
version = "0.1.0"
edition = "2021"
description = "星野 Agent Runtime 核心库：模型适配层 + Run 循环 + 工具系统 + 权限判定（参考 Zed agent 架构分层）"

[dependencies]
rig-core = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
reqwest = "0.12"
