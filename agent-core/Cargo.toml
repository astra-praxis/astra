[package]
name = "agent-core"
version = "0.1.0"
edition = "2021"
description = "Astra Agent Runtime 核心库：模型适配层 + Run 循环 + 工具系统 + 权限判定（参考 Zed agent 架构分层）"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
# fs_tools（Zed 移植工具）用；两者已在依赖树中，声明后零新增编译成本
regex = "1"
glob = "0.3"

# net_tools（fetch/search_web）用；reqwest 此前仅 dev-deps，现在正式进入主依赖
reqwest = { version = "0.12", features = ["json", "stream"] }
url = "2"
percent-encoding = "2"
htmd = "0.5"
# openai_sse 流式响应用（reqwest 传递依赖，声明后零新增编译成本）
bytes = "1"

[dev-dependencies]
