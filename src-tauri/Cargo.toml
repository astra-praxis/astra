[package]
name = "astra"
version = "0.1.0"
description = "星野 - 项目工作空间管理工具"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "astra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-core = { package = "astra-agent", path = "../../astra-core", version = "=1.0.0-rc.1" }
astra-mcp = { path = "../../astra-core/crates/astra-mcp", version = "=1.0.0-rc.1" }
astra-acp = { path = "../../astra-core/crates/astra-acp", version = "=1.0.0-rc.1" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
reqwest = { version = "0.12", features = ["json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "process", "io-util", "rt-multi-thread", "sync"] }
async-trait = "0.1"
which = "7"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }

# Keep proc-macro dylibs unstripped to avoid macOS LINKEDIT loader failures.
[profile.release.build-override]
debug = 0
strip = "none"
