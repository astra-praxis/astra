[package]
name = "astra"
version = "0.1.0"
description = "Astra - 项目工作空间管理工具"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "astra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-core = { package = "astra-agent", path = "../../astra-core", version = "=1.0.0-rc.1" }
astra-mcp = { path = "../../astra-core/crates/astra-mcp", version = "=1.0.0-rc.1" }
astra-acp = { path = "../../astra-core/crates/astra-acp", version = "=1.0.0-rc.1" }
astra-process = { path = "../../astra-core/crates/astra-process", version = "=1.0.0-rc.1" }
# 记忆集成：CME 引擎（加密 sqlite）+ agent-core MemoryProvider 适配器。
# 提炼/召回为确定性规则 + 词法检索，无 ONNX / LLM 模型依赖；
# legacy Formation/Judge 管线冻结在 astra-memory/src/legacy，宿主不启用。
astra-memory = { path = "../../astra-memory", features = ["sqlite"] }
astra-memory-provider = { path = "../../astra-memory/crates/astra-memory-provider" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
reqwest = { version = "0.12", features = ["json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "process", "io-util", "rt-multi-thread", "sync"] }
async-trait = "0.1"
which = "7"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
# mcp_config_tool：保留注释地编辑 ~/.astra/config.toml
# （toml 0.8 内部即 toml_edit 0.22，不引入新编译单元）
toml_edit = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
# 让 agent-core / provider 链路的 tracing 日志在真实 app 里可见
# （recall 失败此前只有哑的 warn）。ASTRA_LOG 覆盖，默认 info。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 用户图片归一化（agent_images.rs）：与 astra-tools 同版本同特性集
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# P0-3 敏感数据加密：providers.json 信封加密 + memory.key 密钥包装
chacha20poly1305 = "0.10"
# 机器级 KEK：优先 OS keychain（macOS Keychain / Windows Credential Manager /
# Linux Secret Service），失败回退本地文件
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
tokio-util = "0.7"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# accounts.rs：实例锁的 pid 存活检测（OpenProcess / GetExitCodeProcess）
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

# Keep proc-macro dylibs unstripped to avoid macOS LINKEDIT loader failures.
[profile.release.build-override]
debug = 0
strip = "none"
